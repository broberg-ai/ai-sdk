name: publish

# Publishes @broberg/ai-sdk to npm via OIDC Trusted Publishing — NO token/secret.
# Triggers:
#   • push a tag matching v*  (e.g. v0.1.1)  → publishes that commit
#   • manual run (Actions → publish → Run workflow)
#
# PREREQUISITE (one-time): the package must already exist on npm AND have a
# Trusted Publisher configured at npmjs.com → @broberg/ai-sdk → Settings →
# Trusted Publisher = broberg-ai/ai-sdk, workflow `publish.yml`. npm has no
# "pending publisher", so v0.1.0 is bootstrapped once by hand; every publish
# after that runs here with zero secrets (OIDC + provenance).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub mint the OIDC token npm exchanges for publish
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # resolves to >=22.14, required by OIDC publishing
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm CLI >= 11.5.1; node 22 still ships 10.x.
      # Pinned to 11.5.1 (NOT @latest): npm v12 breaks `npm publish --provenance`
      # with "Cannot find module 'sigstore'" (fleet-wide, flagged 2026-07-10).
      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Install
        run: bun install --frozen-lockfile

      # Build first — gen-version writes src/version.ts (gitignored), which the
      # tests import (SDK_TAG). Running tests before build => "Cannot find
      # module version.js".
      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Guard — tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # F046.2 — a release must not carry a stale price table.
      #
      # A GATE, NOT A FETCH. The obvious version of this step is "run
      # build-inventory.ts here so every release ships today's prices". It was
      # considered and rejected for three reasons, written down so it is not
      # re-proposed:
      #   1. It would make the tarball non-reproducible. `npm publish --provenance`
      #      attests that this artifact came from this commit; live-fetching prices at
      #      tag time puts data in the package that is in no commit, so building the
      #      same tag twice gives two different packages.
      #   2. It puts a network call in the release path. build-inventory deliberately
      #      swallows per-model enrichment failures ("never fail the build"), so a
      #      degraded fetch would ship a THINNER inventory silently — the exact
      #      shape F046 exists to remove.
      #   3. It would move prices with nobody looking at the diff, which is what the
      #      research workflow's own rule ("we PROPOSE, never auto-merge pricing")
      #      forbids.
      # Refusing to ship a stale table gets the same guarantee and keeps all three.
      - name: Guard — price table is fresh
        run: |
          export THRESHOLD=$(node -p "
            const s = require('fs').readFileSync('src/catalogue/pricing-api.ts','utf8');
            const m = s.match(/PRICING_STALE_AFTER_DAYS = (\d+)/);
            if (!m) { console.error('threshold constant not found'); process.exit(1); }
            m[1]")
          node -e "
            const inv = require('./inventory.json');
            const checked = inv.checkedAt;
            if (!checked) {
              console.error('::error::inventory.json has no checkedAt — cannot say how old these prices are, so we will not ship them. Run: bun run scripts/build-inventory.ts');
              process.exit(1);
            }
            const days = Math.floor((Date.now() - Date.parse(checked)) / 86400000);
            const max = Number(process.env.THRESHOLD);
            if (days > max) {
              console.error(\`::error::price table last verified \${checked} (\${days} days ago, limit \${max}). One week of drift has produced 34 price changes before. Refresh and commit first: bun run scripts/build-inventory.ts\`);
              process.exit(1);
            }
            console.log(\`price table verified \${checked} (\${days}d old, limit \${max}d) — OK\`);
          "

      - name: Guard — version not already on npm
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "@broberg/ai-sdk@$PKG" version >/dev/null 2>&1; then
            echo "::error::@broberg/ai-sdk@$PKG already published — bump the version first."
            exit 1
          fi
          echo "Publishing @broberg/ai-sdk@$PKG"

      # npm (not bun) does the OIDC token exchange + provenance. No NODE_AUTH_TOKEN.
      - name: Publish (OIDC)
        run: npm publish --access public --provenance
