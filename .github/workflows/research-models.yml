name: model-research

# F014.4 + F017.5 — monthly model-catalogue research. Fetches the live catalogue
# (OpenRouter is public — no key needed), diffs it against the pricing table, and
# rebuilds inventory.json. If anything changed, opens a PR with the diff report as
# the body for a human to review (we PROPOSE, never auto-merge pricing).
on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run build

      # Drift report (exit 1 on drift is fine — capture it either way).
      - name: Model-research report
        run: bun run scripts/research-models.ts > /tmp/report.md 2>&1 || true

      # Rebuild inventory.json from the live catalogue + curated overlay (F017.5).
      - name: Rebuild inventory
        run: bun run scripts/build-inventory.ts

      - name: Open PR if the inventory changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # F046 — the script itself now decides which date moves: `checkedAt` on every
          # run, `generatedAt` only when the model DATA differs. So "did anything
          # change" is answerable without a diff heuristic.
          if git diff -I '"generatedAt"' -I '"checkedAt"' --quiet inventory.json; then
            # Nothing substantive — but the CHECK still happened, and that fact is the
            # freshness signal consumers read. The old workflow threw it away with
            # `git checkout`, so a list verified monthly and unchanged was indistinguishable
            # from one nobody had opened since June. A timestamp is not a price, so this
            # one commit to main does not breach "we propose, never auto-merge pricing".
            echo "No substantive change — committing the checkedAt stamp only."
            git add inventory.json
            git commit -m "chore(inventory): verified, no changes [skip ci]" || {
              echo "Nothing at all to commit."; exit 0; }
            git push origin HEAD:main
            exit 0
          fi
          # The run number, not just the date. F046.4: a date-only name collides the
          # SECOND time the workflow runs on one day — and that is not a rare case, it
          # is exactly what happens when the first run failed and someone retries it.
          # Measured 2026-09-03: the retry died on `! [rejected] … (fetch first)` before
          # it ever reached `gh pr create`, so a run that failed for reason A came back
          # having failed for reason B and told us nothing about A.
          #
          # A unique name rather than a force-push: this branch is disposable, but
          # force-pushing is a destructive verb and it is not needed to solve a naming
          # collision.
          BRANCH="model-research/$(date +%Y-%m-%d)-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH"
          git add inventory.json
          git commit -m "chore(inventory): monthly model-research refresh"
          git push -u origin "$BRANCH"
          # Try to open the PR; if the org disables Actions PR-creation, fall back to
          # the pushed branch + a compare URL so a human opens it in one click.
          gh pr create \
            --title "Monthly model-research refresh ($(date +%Y-%m-%d))" \
            --body-file /tmp/report.md \
            --base main --head "$BRANCH" \
          || {
            # FAIL, do not notice. Measured 2026-09-03: this fallback ran on 1 Jul,
            # 1 Aug and 1 Sep — three branches pushed, zero PRs opened, and every run
            # reported SUCCESS. A ::notice:: inside a green run is invisible, so nobody
            # was told for three months while the price table drifted (one week alone
            # produced 34 price changes). A green run must mean "there is a PR".
            echo "::error::PR auto-create is blocked (org policy: Actions may not create PRs)."
            echo "::error::Branch ${BRANCH} IS pushed. Open it here:"
            echo "::error::https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            cat /tmp/report.md
            exit 1
          }
